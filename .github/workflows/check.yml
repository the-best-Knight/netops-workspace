name: Check scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script in index.html
        run: node scripts/check-scripts.mjs
      - name: Engine tests
        run: node tests/engine/suite.mjs
      - name: Tool tests (sanitizer, config diff, calculator, routing, switching, switch lab, vSphere, DNS, ping, lessons, content, script repository, Dell OS9 cheat sheet, saved progress)
        run: for t in sanitizer configdiff calculator routing switching switchlab vsphere dns ping lessons content scriptrepo os9cheat progress; do node tests/engine/$t.mjs || exit 1; done
      - name: Engine fuzz run
        run: node tests/engine/fuzz.mjs 400
